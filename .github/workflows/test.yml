name: test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated go test names to run; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.23.x      # oldest supported (see go.mod)
          - oldstable
          - stable
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      # golangci-lint v2.7 (upstream's pin) was built against an older Go and
      # cannot typecheck the Go 1.27 stdlib that `stable` now resolves to:
      # "export data version 4 is greater than maximum supported version 2".
      # Lint is therefore scoped to the Go releases the pinned linter supports;
      # the test steps below still run on every matrix leg.
      - name: lint
        if: matrix.go-version != 'stable'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7
          args: --print-resources-usage --timeout=10m --verbose

      - name: Test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            go test -v -cover "-coverprofile=coverage.txt" -covermode=atomic -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))$" ./...
          else
            go test -v -cover "-coverprofile=coverage.txt" -covermode=atomic ./...
          fi
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'

      - name: Test (root)
        if: runner.os == 'Linux'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            go test -exec "sudo -E -n" -v -cover "-coverprofile=coverage.txt" -covermode=atomic -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))$" ./...
          else
            go test -exec "sudo -E -n" -v -cover "-coverprofile=coverage.txt" -covermode=atomic ./...
          fi
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'

  # Produces the published release artifact: the Go module proxy zip for this
  # version. Upstream never packaged it in CI (the proxy builds it from the tag),
  # so the pack step lives here alongside the project's own test matrix.
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build module zip
        shell: bash
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/modzip" "$RUNNER_TEMP/out"
          cat > "$RUNNER_TEMP/modzip/main.go" <<'GOEOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              if len(os.Args) != 5 {
                  log.Fatal("usage: create_mod <module-path> <version> <source-dir> <output-zip>")
              }
              m := module.Version{Path: os.Args[1], Version: os.Args[2]}
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
              log.Printf("created module zip: %s", os.Args[4])
          }
          GOEOF
          cd "$RUNNER_TEMP/modzip"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go mod tidy
          go run . github.com/moby/go-archive v0.2.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.2.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.2.0.zip"

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.2.0.zip
          if-no-files-found: error
